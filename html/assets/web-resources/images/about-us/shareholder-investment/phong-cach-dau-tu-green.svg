<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="Phong cách đầu tư">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052d19"/>
      <stop offset="55%" stop-color="#0b5530"/>
      <stop offset="100%" stop-color="#22a06b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="540" rx="24" fill="url(#bg)"/>
  <circle cx="610" cy="80" r="190" fill="url(#glow)"/>
  <circle cx="90" cy="470" r="160" fill="url(#glow)"/>
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="110" x2="720" y2="110"/>
    <line x1="0" y1="200" x2="720" y2="200"/>
    <line x1="0" y1="420" x2="720" y2="420"/>
  </g>

  <!-- vòng la bàn trung tâm -->
  <circle cx="360" cy="270" r="150" fill="#ffffff" opacity="0.08"/>
  <circle cx="360" cy="270" r="150" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
  <circle cx="360" cy="270" r="112" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <g stroke="#ffffff" stroke-width="2" opacity="0.5">
    <line x1="360" y1="110" x2="360" y2="138"/>
    <line x1="360" y1="402" x2="360" y2="430"/>
    <line x1="200" y1="270" x2="228" y2="270"/>
    <line x1="492" y1="270" x2="520" y2="270"/>
  </g>

  <!-- kim la bàn kết hợp mũi tên tăng trưởng -->
  <g transform="rotate(-28 360 270)">
    <polygon points="360,170 382,270 360,282" fill="#8ff0c0"/>
    <polygon points="360,370 338,270 360,258" fill="#ffffff"/>
  </g>
  <circle cx="360" cy="270" r="18" fill="#ffffff"/>
  <circle cx="360" cy="270" r="18" fill="none" stroke="#0b5530" stroke-width="4"/>

  <!-- dãy cột tăng trưởng phía dưới -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round">
    <line x1="270" y1="480" x2="270" y2="450"/>
    <line x1="310" y1="480" x2="310" y2="430"/>
    <line x1="350" y1="480" x2="350" y2="405"/>
    <line x1="390" y1="480" x2="390" y2="440"/>
    <line x1="430" y1="480" x2="430" y2="415"/>
  </g>
  <polyline points="265,452 310,422 350,397 390,432 430,407" fill="none" stroke="#8ff0c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
