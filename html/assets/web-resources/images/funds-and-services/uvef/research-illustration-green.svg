<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="Nghiên cứu và phân tích thị trường">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052d19"/>
      <stop offset="55%" stop-color="#0b5530"/>
      <stop offset="100%" stop-color="#22a06b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="540" rx="24" fill="url(#bg)"/>
  <circle cx="610" cy="90" r="190" fill="url(#glow)"/>
  <circle cx="90" cy="470" r="160" fill="url(#glow)"/>
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="720" y2="120"/>
    <line x1="0" y1="420" x2="720" y2="420"/>
  </g>

  <!-- bảng dữ liệu -->
  <g transform="translate(150,140)">
    <rect x="0" y="0" width="300" height="260" rx="16" fill="#ffffff" opacity="0.95"/>
    <rect x="26" y="28" width="140" height="14" rx="7" fill="#0b5530" opacity="0.65"/>
    <g stroke="#dcefe4" stroke-width="2">
      <line x1="26" y1="70" x2="274" y2="70"/>
      <line x1="26" y1="110" x2="274" y2="110"/>
      <line x1="26" y1="150" x2="274" y2="150"/>
      <line x1="26" y1="190" x2="274" y2="190"/>
    </g>
    <rect x="26" y="78" width="80" height="24" rx="4" fill="#8ff0c0" opacity="0.5"/>
    <rect x="26" y="118" width="130" height="24" rx="4" fill="#8ff0c0" opacity="0.3"/>
    <rect x="26" y="158" width="60" height="24" rx="4" fill="#8ff0c0" opacity="0.5"/>
  </g>

  <!-- biểu đồ tăng trưởng nổi -->
  <g transform="translate(360,240)">
    <rect x="0" y="0" width="230" height="170" rx="16" fill="#0b5530" opacity="0.9"/>
    <polyline points="20,130 60,100 100,115 140,65 180,45 210,30" fill="none" stroke="#8ff0c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#8ff0c0">
      <circle cx="20" cy="130" r="5"/>
      <circle cx="60" cy="100" r="5"/>
      <circle cx="100" cy="115" r="5"/>
      <circle cx="140" cy="65" r="5"/>
      <circle cx="180" cy="45" r="5"/>
      <circle cx="210" cy="30" r="5"/>
    </g>
  </g>

  <!-- kính lúp -->
  <g transform="translate(470,120)">
    <circle cx="40" cy="40" r="40" fill="none" stroke="#ffffff" stroke-width="10"/>
    <line x1="70" y1="70" x2="104" y2="104" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <circle cx="140" cy="440" r="8" fill="#8ff0c0"/>
  <circle cx="600" cy="380" r="6" fill="#ffffff" opacity="0.6"/>
</svg>
