<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-label="Gửi yêu cầu liên hệ">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052d19"/>
      <stop offset="55%" stop-color="#0b5530"/>
      <stop offset="100%" stop-color="#22a06b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="640" rx="24" fill="url(#bg)"/>
  <circle cx="600" cy="110" r="200" fill="url(#glow)"/>
  <circle cx="100" cy="540" r="180" fill="url(#glow)"/>
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="140" x2="720" y2="140"/>
    <line x1="0" y1="500" x2="720" y2="500"/>
  </g>

  <!-- phong bì thư lớn -->
  <g transform="translate(140,220)">
    <rect x="0" y="0" width="440" height="280" rx="18" fill="#ffffff" opacity="0.95"/>
    <path d="M0 18 L220 170 L440 18" fill="none" stroke="#0b5530" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <rect x="0" y="0" width="440" height="280" rx="18" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- bong bóng chat -->
  <g transform="translate(420,120)">
    <rect x="0" y="0" width="190" height="110" rx="20" fill="#8ff0c0"/>
    <path d="M28 108 L28 140 L64 108 Z" fill="#8ff0c0"/>
    <rect x="26" y="30" width="138" height="12" rx="6" fill="#052d19" opacity="0.55"/>
    <rect x="26" y="56" width="100" height="12" rx="6" fill="#052d19" opacity="0.35"/>
  </g>

  <!-- mũi tên gửi đi -->
  <g transform="translate(90,120)" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M0 70 L120 20"/>
    <path d="M120 20 L90 20 M120 20 L120 50"/>
  </g>

  <circle cx="610" cy="470" r="9" fill="#8ff0c0"/>
  <circle cx="650" cy="420" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="260" r="7" fill="#8ff0c0"/>
</svg>
