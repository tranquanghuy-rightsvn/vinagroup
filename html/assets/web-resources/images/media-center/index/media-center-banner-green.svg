  <circle cx="1230" cy="380" r="7" fill="#8ff0c0"/>
  <circle cx="1270" cy="340" r="5" fill="#ffffff" opacity="0.7"/>
  <circle cx="700" cy="420" r="6" fill="#8ff0c0"/>
