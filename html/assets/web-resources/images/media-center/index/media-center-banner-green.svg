<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" role="img" aria-label="Tin Tức &amp; Truyền Thông Vina Group">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052d19"/>
      <stop offset="55%" stop-color="#0b5530"/>
      <stop offset="100%" stop-color="#22a06b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#bg)"/>
  <circle cx="1650" cy="110" r="320" fill="url(#glow)"/>
  <circle cx="200" cy="520" r="260" fill="url(#glow)"/>
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="140" x2="1920" y2="140"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="460" x2="1920" y2="460"/>
  </g>

  <!-- the card documents -->
  <g transform="translate(760,150)">
    <rect x="0" y="40" width="210" height="270" rx="14" fill="#ffffff" opacity="0.10" transform="rotate(-8 105 175)"/>
    <rect x="0" y="40" width="210" height="270" rx="14" fill="#ffffff" opacity="0.92"/>
    <rect x="28" y="80" width="130" height="14" rx="7" fill="#0b5530" opacity="0.7"/>
    <rect x="28" y="110" width="154" height="8" rx="4" fill="#0b5530" opacity="0.35"/>
    <rect x="28" y="128" width="154" height="8" rx="4" fill="#0b5530" opacity="0.35"/>
    <rect x="28" y="146" width="104" height="8" rx="4" fill="#0b5530" opacity="0.35"/>
    <rect x="28" y="190" width="70" height="60" rx="8" fill="#8ff0c0"/>
    <rect x="108" y="190" width="74" height="24" rx="6" fill="#0b5530" opacity="0.15"/>
    <rect x="108" y="222" width="74" height="24" rx="6" fill="#0b5530" opacity="0.15"/>
  </g>

  <!-- broadcasting signal waves + megaphone -->
  <g transform="translate(1040,230)" stroke="#ffffff" fill="none" stroke-linecap="round">
    <path d="M0 60 L70 20 L70 100 Z" fill="#ffffff" opacity="0.95" stroke="none"/>
    <rect x="-18" y="46" width="22" height="28" rx="4" fill="#ffffff" opacity="0.95"/>
    <path d="M90 36C110 48 110 72 90 84" stroke-width="7" opacity="0.85"/>
    <path d="M112 20C142 40 142 80 112 100" stroke-width="7" opacity="0.55"/>
